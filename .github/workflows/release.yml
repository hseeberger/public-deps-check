name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - v*

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check that the tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install git-cliff
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: git-cliff

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git cliff --config cliff.toml --latest --strip header > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
